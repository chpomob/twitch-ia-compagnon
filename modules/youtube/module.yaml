# YouTube live-chat input — manifest v2 (phase 3 R7).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no credential, no companion name and no
# grant lives here. The module polls the live chat of each configured
# channel's active broadcast, authenticates with a configured refresh token
# exchanged for short-lived access tokens, and charges every API request to a
# local daily quota ledger that keeps a reserve for sends.

name: youtube
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

produces:
  - channel.chat.message
consumes: []
middleware: false

# Lifecycle role, never the module name, decides what each phase asks of this
# module (R4). An `input` is a producer: `prepare` binds `chat.write` and
# makes no request (an access token is obtained only when a request needs
# one), `start_inputs` starts one poller per channel after the readiness
# barrier, `stop_inputs` stops them and `close` releases the transport.
lifecycle:
  roles:
    - input

# Business settings belong to the module (R7). The schema states the shape;
# the declared hook, defined by the module package, checks each field and
# reports one diagnostic per offending field naming module and field, with
# no configured value echoed back.
settings_schema:
  type: object
  properties:
    client_id:
      type: string
      description: The application's client identifier (not a secret).
    client_secret:
      type: string
      description: Application secret, resolved from an environment reference.
    refresh_token:
      type: string
      description: >-
        The long-lived refresh token of the companion's account, exchanged at
        the token endpoint for access tokens before they expire.
    channels:
      type: array
      description: >-
        The channel identifiers whose active broadcast's live chat is polled.
      items:
        type: string
    companion_name:
      type: string
      description: >-
        The name viewers use to address the companion, also its display name
        on the platform (anti-echo). Configuration owns this value; the
        default trigger policy below refers to it by token only.
    min_poll_interval_seconds:
      type: integer
      minimum: 1
      maximum: 60
      description: >-
        The shortest spacing between two list requests of one chat; the
        server-given interval is honoured when it is longer. Default 5.
    quota:
      type: object
      description: >-
        The local daily quota ledger. Every API request is charged its cost;
        the ledger resets at 00:00 America/Los_Angeles. A read is issued only
        while it leaves `write_reserve_units` for sends.
      properties:
        daily_units:
          type: integer
          minimum: 1
          description: Units available per quota day. Default 10000.
        write_reserve_units:
          type: integer
          minimum: 0
          description: Units reads may never consume, kept for sends. Default 1000.
        costs:
          type: object
          description: The units each request kind is charged.
          properties:
            list:
              type: integer
              minimum: 0
              description: One live-chat list request. Default 5.
            insert:
              type: integer
              minimum: 0
              description: One chat message send. Default 50.
            delete:
              type: integer
              minimum: 0
              description: One chat message deletion. Default 50.
            ban:
              type: integer
              minimum: 0
              description: One chat ban (a timeout). Default 50.
            broadcast_lookup:
              type: integer
              minimum: 0
              description: One active-broadcast lookup. Default 1.
          additionalProperties: false
      additionalProperties: false
    notices:
      type: object
      description: >-
        Community notices (R1). Absent or empty, only chat messages are
        ingested. A listed kind is fed to the chat context, trigger-evaluated
        and admitted like a message; an unlisted or unmapped event type is
        ignored and counted.
      properties:
        kinds:
          type: array
          description: The notice kinds this module ingests (default none).
          items:
            type: string
            enum:
              - sub
              - resub
              - sub_gift
              - tip
      additionalProperties: false
  required:
    - client_id
    - client_secret
    - refresh_token
    - channels
    - companion_name
settings_validator: validate_settings

# The settings above that are credentials (R8). Their accepted values —
# literal or resolved from `${NAME}` — are redacted from every supervision
# trace and lost-trace diagnostic before this module is activated. The client
# identifier is public, and the channel identifiers are what traces correlate
# by, so neither is declared.
credentials:
  - client_secret
  - refresh_token

# Trigger declaration for the chat input (R1, R7): the same types, operators
# and default as the other chat inputs.
triggers:
  types:
    - name: probability
      parameter_schema:
        type: object
        properties:
          probability:
            type: number
            minimum: 0
            maximum: 1
        required:
          - probability
        additionalProperties: false
    - name: audience
      parameter_schema:
        type: object
        properties:
          audience:
            type: string
            enum:
              - broadcaster
              - everyone
              - moderators
              - subscribers
              - vips
        required:
          - audience
        additionalProperties: false
    - name: keyword
      parameter_schema:
        type: object
        properties:
          keywords:
            type: array
            items:
              type: string
        required:
          - keywords
        additionalProperties: false
    # Selects on the normalised event's kind (R1): `message` for a chat
    # message, the notice kind for a community notice.
    - name: event_kind
      parameter_schema:
        type: object
        properties:
          kinds:
            type: array
            items:
              type: string
              enum:
                - message
                - sub
                - resub
                - sub_gift
                - community_sub_gift
                - raid
                - follow
                - tip
                - watch_tick
        required:
          - kinds
        additionalProperties: false
  combinations:
    - all_of
    - any_of
    - none_of
  # "The message text mentions the configured companion name"; the
  # `${companion_name}` token is resolved by the trigger registry.
  default_policy:
    combination: all_of
    rules:
      - type: keyword
        parameters:
          keywords:
            - "${companion_name}"

# The chat send this module serves (R7), the same contract the other chat
# platforms declare, over this platform's own destinations. One call is one
# insert request to the live chat of the channel's active broadcast, never
# retried; the platform caps a message at 200 characters and has no reply
# thread, so `parent_message_id` is accepted and not forwarded.
actions:
  - name: chat.write
    version: 1
    description: Send one chat message to a channel, optionally as a reply.
    argument_schema:
      type: object
      properties:
        text:
          type: string
          description: Message body; must not be blank.
        parent_message_id:
          type: string
          description: Identifier of the message being replied to, when any.
      required:
        - text
      additionalProperties: false
    result_schema:
      type: object
      properties:
        message_id:
          type: string
          description: Identifier the platform assigned to the delivered message.
        destination:
          type: object
          properties:
            platform:
              type: string
            channel_id:
              type: string
          required:
            - platform
            - channel_id
          additionalProperties: false
      required:
        - message_id
        - destination
      additionalProperties: false
    nature: write
    required_permissions:
      - chat.write
    supported_destinations:
      - platform: youtube
        channel_id: "*"
        scope: chat
    # One send request is bounded by this budget; on expiry the executor
    # reports `timeout` when nothing was emitted and `external_unknown` when
    # the request left and no confirmation came back.
    timeout_seconds: 10
    # The platform offers no replay key: a repeated call may duplicate the
    # message, so no blind retry follows an uncertain outcome.
    idempotency: none
    # Delivery capability (R1 decision 1): this action may close a run as a
    # configured terminal delivery, the final answer text arriving under
    # `text`. The model is never offered it; configuration selects it.
    delivery:
      text_argument: text
