# Automation bridge — manifest v2 (phase 5 R1, R4, R6, R10).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no endpoint, port, password, version,
# action name or grant lives here, and none has a default (R6). The bridge is
# optional in every case (R1): its settings schema declares no `required`
# key at any depth, so a missing or unreachable instance can never fail
# startup; the declared hook refuses a configuration it cannot use (a missing
# `url`, a missing `companion_name`) with one value-free diagnostic per field
# at `--check-config`, before any socket opens.
#
# `users.read` is deliberately NOT declared here: the bridge declares it at
# `prepare` from the `users` manifest itself, so the contract of that action
# stays single-sourced and never drifts between two files.

name: streamerbot
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

# Cues and, when the bridge owns them, replaced chat inputs enter as the one
# normalised chat event every input publishes (R7).
produces:
  - channel.chat.message
consumes: []
middleware: false

# Input ownership (phase 5 R2, R3). The bridge may REPLACE a platform's chat
# or viewer input, never run beside it: it owns no `chat` and no `viewers`
# pair unless the profile's `inputs` block hands it one. Cues — events the
# operator's own automation routes to the companion — are its own family and
# it owns them on every platform by default.
input_families:
  - family: chat
    platforms:
      - twitch
      - kick
      - youtube
    default: false
  - family: viewers
    platforms:
      - twitch
      - kick
      - youtube
    default: false
  - family: cues
    platforms:
      - "*"
    default: true

# Lifecycle role, never the module name, decides what each phase asks of this
# module (R4). An `input` is a producer: `prepare` binds the run action,
# `start_inputs` opens the source after the readiness barrier, `stop_inputs`
# cuts it and `close` releases what remains.
lifecycle:
  roles:
    - input

# Business settings belong to the module (R7). No node is required and the
# endpoint and password carry no default (R1, R6): the declared hook checks
# each field and reports one diagnostic per offending field naming module and
# field, with no configured value echoed back. The reserved `limits` block the
# entry point hands every enabled module is accepted and not read.
settings_schema:
  title: Automation bridge settings
  type: object
  properties:
    url:
      title: URL
      type: string
      description: >-
        The WebSocket URL of the automation application's server, `ws://` or
        `wss://`. A non-loopback host is refused at validation unless the
        scheme is `wss`; loopback may use plain `ws`. No address is assumed.
    password:
      title: Password
      type: string
      description: >-
        The server's authentication password, resolved from an environment
        reference; never logged, never echoed. Absent, the bridge connects
        without authenticating and is degraded if the server requires it.
    companion_name:
      title: Companion name
      type: string
      description: >-
        The name viewers use to address the companion; the default trigger
        policy below refers to it by token only. Configuration owns this
        value and the declared hook refuses a missing one.
    deadlines:
      title: Deadlines
      type: object
      description: >-
        The bounds on each exchange with the server, in seconds, each a
        finite positive number.
      properties:
        connect_seconds:
          title: Connect seconds
          default: 5
          type: number
          description: How long opening the connection may take. Default 5.
        authentication_seconds:
          title: Authentication seconds
          default: 5
          type: number
          description: How long the authentication exchange may take. Default 5.
        request_seconds:
          title: Request seconds
          default: 5
          type: number
          description: How long one request may wait for its response. Default 5.
        acknowledgement_seconds:
          title: Acknowledgement seconds
          default: 10
          type: number
          description: >-
            How long a run request may wait for the server's acknowledgement;
            it must stay below the run action's own timeout. Default 10.
      additionalProperties: false
    reconnect:
      title: Reconnect
      type: object
      description: >-
        Bounded backoff between connection attempts; a lost connection is
        retried from the minimum delay up to the maximum.
      properties:
        min_delay_seconds:
          title: Min delay seconds
          default: 1
          type: number
          description: The first delay after a lost connection. Default 1.
        max_delay_seconds:
          title: Max delay seconds
          default: 60
          type: number
          description: The cap every delay stays under. Default 60.
      additionalProperties: false
    queue_max_events:
      title: Queue max events
      default: 256
      type: integer
      description: >-
        How many inbound events wait for the consumer; an event arriving at a
        full queue is dropped and counted. Default 256.
    allowlist:
      title: Allowlist
      type: array
      description: >-
        The instance actions the run action may reach, each entry naming
        exactly one action or one group. Absent or empty, every run is
        refused. A group entry delegates the choice of reachable actions to
        whoever edits that group in the instance.
      items:
        title: Allowlist entry
        type: object
        properties:
          action:
            title: Action
            type: string
            description: The instance action's name, as the instance shows it.
          group:
            title: Group
            type: string
            description: The instance group's name; every action in it is reachable.
          arguments:
            title: Arguments
            type: object
            description: >-
              The schema the run's `arguments` must satisfy for this entry.
              Absent, only an empty `arguments` object is accepted.
        additionalProperties: false
    companion_identities:
      title: Companion identities
      type: object
      description: >-
        The companion's own account identifier per platform, by platform
        name. Required for every platform whose chat the bridge owns, so a
        message the companion authored is never answered (anti-echo).
    instance_identity:
      title: Instance identity
      type: object
      description: >-
        The broadcaster account identifier per platform, by platform name:
        the channel a cue without one is attributed to, and the only channel
        the bridge's viewer read answers for.
    trust_instance_roles:
      title: Trust instance roles
      default: false
      type: boolean
      description: >-
        Whether role claims reported by the instance (moderator, subscriber…)
        are trusted by audience rules. Default false.
    limits:
      title: Limits
      type: object
      description: >-
        The accepted `limits` block, handed over by the entry point to every
        enabled module. Not read here.
settings_validator: validate_settings

# The password is a credential (R6, R8): its accepted value — literal or
# resolved from `${NAME}` — is redacted from every supervision trace and
# lost-trace diagnostic before this module is activated.
credentials:
  - password

# Trigger declaration (R7): the types the native chat inputs declare, the
# `event_kind` type among them, so a cue is selected by its kind.
triggers:
  types:
    - name: probability
      parameter_schema:
        type: object
        properties:
          probability:
            type: number
            minimum: 0
            maximum: 1
        required:
          - probability
        additionalProperties: false
    - name: audience
      parameter_schema:
        type: object
        properties:
          audience:
            type: string
            enum:
              - broadcaster
              - everyone
              - moderators
              - subscribers
              - vips
        required:
          - audience
        additionalProperties: false
    - name: keyword
      parameter_schema:
        type: object
        properties:
          keywords:
            type: array
            items:
              type: string
        required:
          - keywords
        additionalProperties: false
    - name: event_kind
      parameter_schema:
        type: object
        properties:
          kinds:
            type: array
            items:
              type: string
              enum:
                - message
                - sub
                - resub
                - sub_gift
                - community_sub_gift
                - raid
                - follow
                - tip
                - watch_tick
                - cue
        required:
          - kinds
        additionalProperties: false
  combinations:
    - all_of
    - any_of
    - none_of
  # Every cue is accepted; a chat-family message the bridge owns is accepted
  # when it mentions the configured companion name — the rule the native chat
  # inputs default to. The `${companion_name}` token is resolved by the
  # trigger registry.
  default_policy:
    combination: any_of
    rules:
      - type: event_kind
        parameters:
          kinds:
            - cue
      - type: keyword
        parameters:
          keywords:
            - "${companion_name}"

# The one write this module serves (R4): run one allowlisted action of the
# operator's own instance. It is honest about silence: the instance
# acknowledges a request, it never reports that the action ran, so the action
# never ends `success`.
actions:
  - name: automation.action.run
    version: 1
    description: >-
      Run one allowlisted action of the operator's automation application by
      name. Acceptance by the automation application is not a confirmation
      that the action ran.
    argument_schema:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 128
          description: The allowlisted instance action to run, by name.
        arguments:
          type: object
          description: The arguments handed to the instance action.
      required:
        - action
      additionalProperties: false
    result_schema:
      type: object
      additionalProperties: false
    nature: write
    model_proposable: false
    required_permissions:
      - automation.run
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: automation
    # Fixed: the bridge's acknowledgement deadline must stay below it by the
    # validator's margin, so the executor's own timeout never pre-empts the
    # bridge's cause.
    timeout_seconds: 15
    # The instance offers no replay key: a repeated call may run the action
    # twice, so no blind retry follows an uncertain outcome.
    idempotency: none
    # Effect-only delivery capability: the action may close a run as a
    # configured terminal delivery, and no answer text is mapped into it.
    delivery:
      text_argument: none
