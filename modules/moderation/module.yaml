# Configurable moderation under strict rules — manifest v2 (phase 3 R5).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no grant lives here, so the model is
# offered `moderation.request` only when a configured rule grants it. The
# action is the one write a manifest flags `model_proposable`; the configured
# `mode` decides what a request does, and the shipped default, `alert`, sends
# nothing to any platform. A platform acts through the `moderation` service
# it publishes in the runtime service registry. No platform name appears here.

name: moderation
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

# The module reads chat messages to index each message's author and trusted
# roles (a `target_protected` refusal reads them). It publishes its
# `moderation.decision` facts through supervision, not as a routed event.
produces: []
consumes:
  - channel.chat.message
middleware: false

# No lifecycle role: the handle takes part in `prepare` (resolve the
# moderation services, index the chat, bind, spawn the supervised proposal
# expiry sweep when a mode `propose` is configured, mark ready), `drain` (stop
# the sweep, refuse new requests and commands, wait for the requests and
# approvals in flight) and `close` (withdraw readiness).
lifecycle:
  roles: []

# The mode and the strict rules (R5). The shapes are checked by the declared
# hook, one value-free diagnostic per field. The reserved `limits` block the
# entry point hands every enabled module is read for its `chat_context`
# group only: the message index is capped by the transcript's own bounds.
settings_schema:
  title: Moderation settings
  type: object
  properties:
    mode:
      title: Mode
      default: "alert"
      type: string
      enum:
        - alert
        - propose
        - act
      description: >-
        What a request does: `alert` records it and sends nothing, `propose`
        stores a proposal a trusted broadcaster or moderator approves, `act`
        applies it under the strict rules. Default `alert`.
    channels:
      title: Channels
      type: object
      description: >-
        Per-channel overrides keyed `<platform>/<channel_id>`, each an object
        whose only key is `mode`.
    act:
      title: Act
      type: object
      properties:
        operations:
          title: Operations
          default: ["delete_message"]
          type: array
          items:
            type: string
            enum:
              - delete_message
              - timeout
          description: >-
            The operations an application may perform; any other is refused
            `operation_not_allowed`. Default `[delete_message]`.
    max_timeout_seconds:
      title: Max timeout seconds
      default: 300
      type: integer
      minimum: 1
      maximum: 3600
      description: >-
        The longest timeout, after the platform's unit rounding; a longer or
        a non-positive one is refused `duration_out_of_range`. Default 300.
    max_actions_per_window:
      title: Max actions per window
      default: 3
      type: integer
      minimum: 1
      maximum: 20
      description: >-
        How many platform requests one channel may send within
        `window_seconds`; one more is refused `rate_limited`. Default 3.
    window_seconds:
      title: Window seconds
      default: 600
      type: integer
      minimum: 60
      maximum: 86400
      description: The sliding window `max_actions_per_window` counts in. Default 600.
    per_target_cooldown_seconds:
      title: Per-target cooldown seconds
      default: 600
      type: integer
      minimum: 0
      maximum: 86400
      description: >-
        The least time between two platform requests aimed at one author of
        one channel; an earlier one is refused `target_cooldown`. Default 600.
    propose:
      title: Propose
      type: object
      description: >-
        The proposal settings of mode `propose`. A proposal is applied by
        `<approve_command> <id>` or discarded by `<reject_command> <id>`,
        authored in its own channel by a trusted broadcaster or moderator.
      properties:
        max_pending:
          title: Max pending
          default: 32
          type: integer
          minimum: 1
          maximum: 256
          description: >-
            How many proposals may wait; a new one evicts the one closest to
            expiry, which is recorded `expired`. Default 32.
        proposal_ttl_seconds:
          title: Proposal TTL seconds
          default: 300
          type: integer
          minimum: 30
          maximum: 3600
          description: How long a proposal waits before it expires. Default 300.
        auto_apply:
          title: Auto apply
          default: []
          type: array
          items:
            type: string
            enum:
              - delete_message
              - timeout
          description: >-
            The operations applied at once, under the strict rules, instead of
            waiting for an approval. Default empty.
        approve_command:
          title: Approve command
          default: "!modok"
          type: string
          description: The chat command that applies a proposal. Default `!modok`.
        reject_command:
          title: Reject command
          default: "!modno"
          type: string
          description: The chat command that discards a proposal. Default `!modno`.
    limits:
      title: Limits
      type: object
      description: >-
        The accepted `limits` block, handed over by the entry point to every
        enabled module. Its `chat_context` group caps the message index.
settings_validator: validate_settings

actions:
  - name: moderation.request
    version: 1
    description: >-
      Ask for one moderation of a chat message of this channel: delete it, or
      time its author out for `duration_seconds`. What happens depends on the
      configured mode: it may only be recorded, proposed to the broadcaster,
      or applied under strict rules. Nothing removes a viewer permanently.
    # The executor checks the shapes; the module checks what the schema subset
    # cannot say: `reason` at most 200 characters, and `duration_seconds`
    # required with `timeout` and refused with `delete_message`.
    argument_schema:
      type: object
      properties:
        operation:
          type: string
          enum:
            - delete_message
            - timeout
        message_id:
          type: string
          description: The identifier of the chat message the request is about.
        reason:
          type: string
          description: Why, in at most 200 characters.
        duration_seconds:
          type: integer
          description: For `timeout` only, and required with it.
      required:
        - operation
        - message_id
        - reason
      additionalProperties: false
    result_schema:
      type: object
      properties:
        disposition:
          type: string
          enum:
            - alerted
            - proposed
            - applied
        proposal_id:
          type: string
        operation:
          type: string
        message_id:
          type: string
      required:
        - disposition
        - operation
        - message_id
      additionalProperties: false
    nature: write
    model_proposable: true
    required_permissions:
      - moderation.request
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: moderation
    timeout_seconds: 10
    # Applying twice acts twice.
    idempotency: none
