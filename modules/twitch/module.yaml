# Twitch chat input and chat-send provider — manifest v2 (R1, R5, R7).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no credential, no companion name and no
# grant lives here. Declaring `chat.write` records the action in the loader's
# *discovered* view; only an explicit authorization rule ever offers it (R5).

name: twitch
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

produces:
  - channel.chat.message
# The compatibility `channel.chat.send` route (phase 6 R1). Each publication
# becomes one executor invocation of `chat.write` below, for the configured
# channel, under the explicit principal `channel.chat.send`
# (`COMPATIBILITY_PRINCIPAL`). Default-deny applies: without an authorization
# rule granting `chat.write` to that principal the publication is refused, no
# request is sent and its metadata reads `delivery_status: failed` with the
# executor's terminal status. Without an executor it is refused the same way.
consumes:
  - channel.chat.send
middleware: false

# Input ownership (phase 5 R2, R3). This module ingests the (`chat`, twitch)
# pair — messages and every notice kind, follow included — and owns it by
# default. The profile's `inputs` block may hand the pair to another provider;
# `start_inputs` then opens no EventSub socket and no subscription, while
# `chat.write` stays bound and ready. Never two providers for one pair.
input_families:
  - family: chat
    platforms:
      - twitch
    default: true

# Lifecycle role, never the module name, decides what each phase asks of this
# module (R4). An `input` is a producer: its handle exposes `prepare`, is held
# at the readiness barrier, then `start_inputs`, `stop_inputs` and `close`;
# it has no role in drain, flush or observation close.
lifecycle:
  roles:
    - input

# Business settings belong to the module (R7). The schema states the shape;
# the declared hook, defined by the module package, checks each field and
# reports one diagnostic per offending field naming module and field, with
# no configured value echoed back.
settings_schema:
  title: Twitch settings
  type: object
  properties:
    client_id:
      title: Client ID
      type: string
      description: Application identifier presented on every platform request.
    client_secret:
      title: Client secret
      type: string
      description: Application secret, resolved from an environment reference.
    access_token:
      title: Access token
      type: string
      description: User token authorising the chat subscription and sends.
    broadcaster_id:
      title: Broadcaster ID
      type: string
      description: Channel whose chat is read and written.
    bot_user_id:
      title: Bot user ID
      type: string
      description: The companion's own account, used to send and for anti-echo.
    companion_name:
      title: Name of the companion
      type: string
      description: >-
        The name viewers use to address the companion. Configuration owns this
        value; the default trigger policy below refers to it by token only.
    notices:
      title: Notices
      type: object
      description: >-
        Community notices (R1). Absent or empty, only chat messages are
        subscribed to, as before. A listed chat-notification kind adds the
        chat-notification subscription; `follow` adds the follow subscription,
        which needs the moderator follower-read scope for the bot account — a
        rejected follow subscription degrades `follow` only and chat
        continues. A listed notice is fed to the chat context,
        trigger-evaluated and admitted like a message; an unlisted or other
        notice type is ignored and counted. `reward` (phase 8 R5) is not a
        platform notice: it adds the channel-points redemption subscription,
        which needs the redemption-read scope for the broadcaster — a
        rejected one degrades `reward` only and chat continues — and each
        redemption is a `reward` event the `reward` trigger type selects on.
      properties:
        kinds:
          title: Kinds
          type: array
          description: The notice kinds this module ingests (default none).
          items:
            type: string
            enum:
              - sub
              - resub
              - sub_gift
              - community_sub_gift
              - raid
              - follow
              - reward
      additionalProperties: false
  required:
    - client_id
    - client_secret
    - access_token
    - broadcaster_id
    - bot_user_id
    - companion_name
settings_validator: validate_settings

# The settings above that are credentials (R8). Their accepted values —
# literal or resolved from `${NAME}` — are redacted from every supervision
# trace and lost-trace diagnostic before this module is activated, whether or
# not the configuration lists them under `secrets`. The identifiers traces
# correlate by — the broadcaster, the bot account — are deliberately not
# declared: a redacted channel would break correlation, not protect a secret.
credentials:
  - client_id
  - client_secret
  - access_token

# Trigger declaration for the chat input (R1). Configuration may select only a
# declared type, pass only parameters its schema accepts and combine rules
# only with a declared operator; an explicitly configured policy replaces the
# default entirely rather than combining with it.
triggers:
  types:
    - name: probability
      parameter_schema:
        type: object
        properties:
          probability:
            type: number
            minimum: 0
            maximum: 1
        required:
          - probability
        additionalProperties: false
    - name: audience
      parameter_schema:
        type: object
        properties:
          audience:
            type: string
            enum:
              - broadcaster
              - everyone
              - moderators
              - subscribers
              - vips
        required:
          - audience
        additionalProperties: false
    - name: keyword
      parameter_schema:
        type: object
        properties:
          keywords:
            type: array
            items:
              type: string
        required:
          - keywords
        additionalProperties: false
    # Selects on the normalised event's kind (R1): `message` for a chat
    # message, the notice kind for a community notice.
    - name: event_kind
      parameter_schema:
        type: object
        properties:
          kinds:
            type: array
            items:
              type: string
              enum:
                - message
                - sub
                - resub
                - sub_gift
                - community_sub_gift
                - raid
                - follow
                - tip
                - watch_tick
                - cue
                - reward
                - manual
                - speech
                - timer
        required:
          - kinds
        additionalProperties: false
    # A channel-points redemption (phase 8 R5): matches a `reward` event whose
    # reward is listed and whose cost lies within the bounds given; an absent
    # bound is no bound (R2). Declared, evaluated by the kernel: no module
    # code runs for it, and it grants nothing.
    - name: reward
      kinds:
        - reward
      parameter_schema:
        type: object
        properties:
          reward_ids:
            type: array
            items:
              type: string
          min_cost:
            type: integer
            minimum: 0
          max_cost:
            type: integer
            minimum: 0
        required:
          - reward_ids
        additionalProperties: false
      match:
        all:
          - in:
              - field: reward.id
              - param: reward_ids
          - gte:
              - field: reward.cost
              - param: min_cost
          - lte:
              - field: reward.cost
              - param: max_cost
  # The payload fields this input emits beyond the canonical ones (phase 8
  # A4), so a declared type may only read what a redemption carries.
  fields:
    reward.id: string
    reward.title: string
    reward.cost: integer
  combinations:
    - all_of
    - any_of
    - none_of
  # Exactly one default for the input type: "the message text mentions the
  # configured companion name". The `${companion_name}` token is resolved by
  # the trigger registry from configuration; the manifest never spells the
  # name, so two deployments share this shape and differ only in settings.
  default_policy:
    combination: all_of
    rules:
      - type: keyword
        parameters:
          keywords:
            - "${companion_name}"

# Action contracts this module provides (R5). Declaring one authorizes
# nothing: `produces: [channel.chat.message]`, the `consumes` route and this
# block all leave `chat.write` refused until a rule grants `chat.write`.
actions:
  - name: chat.write
    version: 1
    description: Send one chat message to a channel, optionally as a reply.
    argument_schema:
      type: object
      properties:
        text:
          type: string
          description: Message body; must not be blank.
        parent_message_id:
          type: string
          description: Identifier of the message being replied to, when any.
      required:
        - text
      additionalProperties: false
    result_schema:
      type: object
      properties:
        message_id:
          type: string
          description: Identifier the platform assigned to the delivered message.
        destination:
          type: object
          properties:
            platform:
              type: string
            channel_id:
              type: string
          required:
            - platform
            - channel_id
          additionalProperties: false
      required:
        - message_id
        - destination
      additionalProperties: false
    nature: write
    required_permissions:
      - chat.write
    supported_destinations:
      - platform: twitch
        channel_id: "*"
        scope: chat
    # One send request is bounded by this budget; on expiry the executor
    # reports `timeout` when nothing was emitted and `external_unknown` when
    # the request left and no confirmation came back.
    timeout_seconds: 10
    # The platform offers no replay key: a repeated call may duplicate the
    # message, so no blind retry follows an uncertain outcome.
    idempotency: none
    # Delivery capability (R1 decision 1): this action may close a run as a
    # configured terminal delivery, the final answer text arriving under
    # `text`. The model is never offered it; configuration selects it.
    delivery:
      text_argument: text
