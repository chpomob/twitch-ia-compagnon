# Audio capture into the run-leased attachment store — manifest v2 (R3, R4).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no grant lives here. Declaring
# `audio.capture` records the action in the loader's *discovered* view; only
# an explicit authorization rule ever offers it: without one, nothing is
# recorded and no process is spawned. The action is a `read` on the `audio`
# scope of any platform and any channel: which microphone or mix is recorded
# is the business of the configured *source*, never of the brain and never of
# a platform, so no platform name appears here.

name: audio_input
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

# A capture is on demand only: the brain asks for one segment when it needs
# it, the module records it and returns a reference. Nothing is recorded in
# the background and nothing is published: the module produces and consumes
# no event.
produces: []
consumes: []
middleware: false

# No lifecycle role: the handle takes part in `prepare` (probe every
# configured source, bind the provider when one is usable), in `drain` (kill
# a running recorder, the call ending `cancelled`) and in `close` (withdraw
# readiness) — and it spawns no task and no process outside a call.
lifecycle:
  roles: []

# The sources this module may record from, which one is used when the call
# names none, and the bounds every capture is held to (R3). The shapes inside
# `sources` — `{kind: command, argv[]}` or `{kind: file, path}` — are checked
# by the declared hook, one diagnostic per field, value-free: no path and no
# argv is ever echoed. `grace_seconds` is the admission reserve of
# `capture_too_long` and nothing else: a recorder that was admitted is killed
# at the call deadline itself. The reserved `limits` block the entry point
# hands every enabled module is accepted and not read.
settings_schema:
  type: object
  properties:
    sources:
      type: object
      description: >-
        The named audio sources. A `command` source (`kind: command`, `argv`)
        runs the configured program at the call and takes the WAV it writes
        on stdout, stopped once the requested duration is recorded; a `file`
        source (`kind: file`, `path`) is a WAV re-read at each call. Either
        must deliver PCM 16-bit, 16 000 Hz, mono.
    default_source:
      type: string
      description: The source a call that names none records from.
    max_seconds:
      type: integer
      minimum: 1
      description: The longest segment one call may request. Default 30.
    max_bytes:
      type: integer
      minimum: 1
      description: >-
        The most bytes one stored segment may weigh; a larger one is refused
        `attachment_refused` with nothing stored. Default 1048576.
    grace_seconds:
      type: number
      minimum: 0
      description: >-
        The admission reserve: a call whose `seconds` exceed the time left
        before its deadline minus this reserve is refused `capture_too_long`
        before any process is spawned. Default 2.
    transcription:
      type: object
      description: >-
        The optional transcription of each stored segment by an HTTP
        endpoint. No endpoint is assumed: while it is empty nothing is sent.
      properties:
        enabled:
          type: boolean
          description: Whether a stored segment is transcribed. Default false.
        endpoint:
          type: string
          description: The transcription URL; empty until the operator configures one.
        model:
          type: string
          description: The transcription model name sent with each request.
        api_key:
          type: string
          description: >-
            Optional bearer credential; sent as an Authorization header when
            non-empty, redacted from every trace and diagnostic.
        language:
          type: string
          description: Optional language hint sent with each request.
        timeout_seconds:
          type: number
          description: How long one transcription request may take. Default 10.
        max_chars:
          type: integer
          minimum: 1
          description: The most characters of transcription text kept. Default 2000.
    required:
      type: boolean
      description: >-
        Whether an unusable source at `prepare` fails startup (true) or is
        reported and left aside (false). Default false.
    limits:
      type: object
      description: >-
        The accepted `limits` block, handed over by the entry point to every
        enabled module. Not read here: this module owns its own bounds.
  required:
    - sources
    - default_source
settings_validator: validate_settings

credentials:
  - transcription.api_key

# The `audio.capture` contract (R3, R4). The optional `source` names a
# configured source; the result states which source served, what was stored
# and when, and the observation carries exactly one `audio_ref` part — a
# reference into the run-leased store, never bytes and never a path. A `read`
# carries no delivery capability.
actions:
  - name: audio.capture
    version: 1
    description: >-
      Record a bounded audio segment (PCM 16-bit, 16 000 Hz, mono) from a
      configured source into the run's attachment store and return its
      reference with its duration and format.
    argument_schema:
      type: object
      properties:
        seconds:
          type: integer
          minimum: 1
          description: >-
            How many seconds to record, 1 to the configured `max_seconds`,
            and no more than the time left before the call deadline allows.
        source:
          type: string
          description: >-
            The configured source to record from; omit it for the configured
            default.
      required:
        - seconds
      additionalProperties: false
    result_schema:
      type: object
      properties:
        source:
          type: string
          description: The name of the source that served the capture.
        content_type:
          type: string
          enum:
            - audio/wav
          description: The content type of the stored segment.
        size:
          type: integer
          minimum: 1
          description: The bytes the store retains for this segment, header included.
        duration_ms:
          type: integer
          minimum: 1
          description: The segment duration read from its data chunk.
        sample_rate_hz:
          type: integer
          minimum: 1
          description: The sample rate of the stored segment.
        channels:
          type: integer
          minimum: 1
          description: The channel count of the stored segment.
        captured_at:
          type: number
          description: When the segment was acquired, on the runtime clock.
        transcription_status:
          type: string
          description: >-
            What became of the optional transcription: `disabled` when it is
            not enabled.
      required:
        - source
        - content_type
        - size
        - duration_ms
        - sample_rate_hz
        - channels
        - captured_at
        - transcription_status
      additionalProperties: false
    nature: read
    required_permissions:
      - audio.capture
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: audio
    timeout_seconds: 45
    # Two captures are two recordings of a moving sound: neither a key nor
    # nature makes a repeat equivalent to the first.
    idempotency: none
