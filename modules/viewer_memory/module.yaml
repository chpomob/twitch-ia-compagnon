# Viewer memory store — manifest v2 (phase 3 R3).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no grant lives here. The module keeps
# one small JSON file per `(platform, channel_id, viewer_id)` in a configured
# directory, bounded in count, bytes, notes and age. No platform name appears
# here. It provides `memory.recall` and `memory.record` (R4): the viewer of
# both is the run's session viewer, read from the call's `conversation_id`,
# never an argument.

name: viewer_memory
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

# The module reads chat messages for the erasure command only (`!forgetme`
# from its trusted author, whatever the trigger decides). It publishes the
# `memory.removed` facts through supervision, not as a routed event.
produces: []
consumes:
  - channel.chat.message
middleware: false

# The `input` role, for its one source of work: the periodic retention sweep,
# a supervised task. `prepare` scans the directory (deletes corrupt and
# expired files, evicts down to the bounds) and routes the erasure command,
# all before readiness; `start_inputs`, after the barrier, starts the sweep;
# `stop_inputs` stops it before the drain, so shutdown never waits on it;
# `close` stops what still runs.
lifecycle:
  roles:
    - input

# The bounds of the store (R3). The shapes are checked by the declared hook,
# one value-free diagnostic per field, including the cross-field bound
# `max_total_bytes >= max_file_bytes`. The reserved `limits` block the entry
# point hands every enabled module is accepted and not read.
settings_schema:
  type: object
  properties:
    directory:
      type: string
      description: >-
        The directory the memory files live in. Created at prepare when
        absent. Only files named like memory files are ever read, counted or
        deleted there.
    retention_days:
      type: integer
      minimum: 1
      maximum: 365
      description: >-
        A record whose `last_seen` is older than this is deleted at prepare
        and at every sweep, and is never returned. Default 30.
    max_files:
      type: integer
      minimum: 1
      maximum: 100000
      description: The most memory files the directory holds. Default 1000.
    max_file_bytes:
      type: integer
      minimum: 512
      maximum: 65536
      description: >-
        The largest a memory file may be; the oldest notes are dropped to fit.
        Default 4096.
    max_total_bytes:
      type: integer
      minimum: 512
      maximum: 1073741824
      description: >-
        The most bytes all memory files hold together; at least
        `max_file_bytes`. Default 16777216.
    max_notes:
      type: integer
      minimum: 1
      maximum: 100
      description: The most notes one memory file keeps. Default 10.
    sweep_interval_seconds:
      type: integer
      minimum: 60
      maximum: 86400
      description: How often expired records are swept. Default 3600.
    max_recall_bytes:
      type: integer
      minimum: 512
      maximum: 8192
      description: >-
        The most UTF-8 bytes a recall observation serializes to; notes are
        left out oldest first, then the display name is shortened, to fit.
        Default 1024.
    forget_command:
      type: string
      description: >-
        The exact chat text by which a trusted author erases their own memory
        file for that platform and channel. Default `!forgetme`; empty
        disables it.
    limits:
      type: object
      description: >-
        The accepted `limits` block, handed over by the entry point to every
        enabled module. Not read here: this module owns its own bounds.
  required:
    - directory
settings_validator: validate_settings

# The viewer of both actions is the session's, from the call's
# `conversation_id`; no argument names a viewer, platform or channel, so an
# identity argument is refused as invalid before the provider runs. A
# session without a platform viewer (a reserved `:` identity, as a watch
# run's) ends `error no_viewer`.
actions:
  - name: memory.recall
    version: 1
    description: >-
      Recall what is remembered of the viewer of this conversation: whether
      they are known, their display name, when they were first and last seen,
      how many exchanges they had, and the most recent notes first.
    # No arguments: the session names the viewer.
    argument_schema:
      type: object
      properties: {}
      additionalProperties: false
    result_schema:
      type: object
      properties:
        known:
          type: boolean
        display_name:
          type: string
        first_seen:
          type: string
          description: UTC, ISO 8601 with microseconds.
        last_seen:
          type: string
          description: UTC, ISO 8601 with microseconds.
        interactions:
          type: integer
        notes:
          type: array
          description: The retained notes, the most recent first.
          items:
            type: object
            properties:
              at:
                type: string
              viewer_text:
                type: string
              reply_text:
                type: string
              delivery:
                type: string
                enum:
                  - confirmed
                  - unconfirmed
                  - none
            required:
              - at
              - viewer_text
              - delivery
            additionalProperties: false
        truncated:
          type: boolean
          description: True when a note or part of the display name was left out.
      required:
        - known
      additionalProperties: false
    nature: read
    required_permissions:
      - memory.recall
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: memory
    timeout_seconds: 5
    idempotency: natural
  - name: memory.record
    version: 1
    description: >-
      Record one exchange with the viewer of this conversation. Called by the
      runtime after the delivery, never proposed by the model.
    # The exchange data only: no viewer, platform or channel property.
    argument_schema:
      type: object
      properties:
        viewer_text:
          type: string
          description: The triggering text, at most 200 characters.
        reply_text:
          type: string
          description: The delivered text, at most 200 characters.
        delivery:
          type: string
          enum:
            - confirmed
            - unconfirmed
            - none
        display_name:
          type: string
          description: The viewer's display name; stored cut to 64 characters.
      required:
        - viewer_text
        - delivery
      additionalProperties: false
    result_schema:
      type: object
      properties:
        interactions:
          type: integer
        notes:
          type: integer
          description: The notes the file keeps after this record.
      required:
        - interactions
        - notes
      additionalProperties: false
    nature: write
    required_permissions:
      - memory.record
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: memory
    timeout_seconds: 5
    idempotency: none
