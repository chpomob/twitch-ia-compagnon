# Language-model run engine — manifest v2 (R7).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no credential, no endpoint and no grant
# lives here. `produces: [channel.chat.send]` and `consumes:
# [channel.chat.message]` describe routing; neither authorizes anything, and
# this manifest declares no action and no trigger, so the action registry
# discovers nothing from it and the authorized view it offers the model stays
# empty until an explicit rule grants a provider's action (R5, R7).

name: brain
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

produces:
  - channel.chat.send
consumes:
  - channel.chat.message
middleware: false

# Lifecycle participation, never the module name, decides what each phase asks
# of this module (R4). The engine is neither an `input` (it opens no source, so
# it has no `start_inputs`/`stop_inputs` phase) nor an `observation` (it flushes
# nothing after the last close). With no role it takes part in the phases of an
# ordinary resource — `prepare`, the readiness barrier, `drain` and `close` —
# through whichever of those hooks its handle exposes.
lifecycle:
  roles: []

# Business settings belong to the module (R7). The schema states the shape;
# the declared hook, defined by the module package, checks what a schema
# cannot — a well-formed endpoint, a resolved key, finite positive limits —
# and reports one diagnostic per offending field naming module and field,
# with no configured value echoed back.
settings_schema:
  title: Brain settings
  type: object
  properties:
    endpoint:
      title: Endpoint
      type: string
      description: Chat-completions URL of the configured model backend.
    model:
      title: Model
      type: string
      description: Name of the model requested from that backend.
    api_key:
      title: API key
      type: string
      description: Bearer credential, resolved from an environment reference.
    # Admission limits the engine owns: one bounded FIFO per session, a global
    # pending cap, a live-session cap, a bounded worker count, a finite wait
    # deadline per queued item and a finite total deadline per run (R2).
    admission:
      title: Admission
      type: object
      properties:
        session_queue_capacity:
          title: Session queue capacity
          type: integer
          minimum: 1
          description: Maximum queued works per session.
        global_pending_capacity:
          title: Global pending capacity
          type: integer
          minimum: 1
          description: Maximum queued works across every session.
        max_sessions:
          title: Max sessions
          type: integer
          minimum: 1
          description: Maximum live sessions before a new one is refused.
        workers:
          title: Workers
          type: integer
          minimum: 1
          description: Bounded number of run workers.
        wait_seconds:
          title: Wait seconds
          type: number
          description: Finite deadline a queued work may wait before it starts.
        total_run_seconds:
          title: Total run seconds
          type: number
          description: Finite deadline from admission to delivery, wait included.
      required:
        - session_queue_capacity
        - global_pending_capacity
        - max_sessions
        - workers
        - wait_seconds
        - total_run_seconds
    # Per-run budgets the engine owns (R3): model turns, the delay of one
    # model call, the delay of one action call (delivery included), the
    # cumulated token budget, the largest observation the transcript accepts,
    # the action calls a run may make (every delivery entry and the fallback
    # included), the repetitions of one identical proposal, and the time kept
    # back before the total deadline for the whole terminal step.
    budget:
      title: Budget
      type: object
      properties:
        model_turns:
          title: Model turns
          type: integer
          minimum: 1
          description: Maximum model calls per run.
        model_call_seconds:
          title: Model call seconds
          type: number
          description: Finite deadline of one model call.
        action_seconds:
          title: Action seconds
          type: number
          description: Finite deadline of one action call, delivery included.
        max_tokens:
          title: Max tokens
          type: integer
          minimum: 1
          description: Cumulated input and output tokens per run.
        max_observation_bytes:
          title: Max observation bytes
          type: integer
          minimum: 1
          description: Largest observation or medium admitted into a transcript.
        max_action_calls:
          title: Max action calls
          type: integer
          minimum: 1
          description: >-
            Maximum action calls per run, every delivery entry and the
            fallback included.
        max_repeated_actions:
          title: Max repeated actions
          type: integer
          minimum: 1
          description: >-
            Executions of one identical proposal (same action name and
            canonical arguments) within one run; the next one is not executed.
        delivery_reserve_seconds:
          title: Delivery reserve seconds
          type: number
          description: >-
            Time kept back before the total run deadline for the whole
            terminal delivery step; no model turn or non-delivery action
            starts inside it.
      required:
        - model_turns
        - model_call_seconds
        - action_seconds
        - max_tokens
        - max_observation_bytes
        - max_action_calls
        - max_repeated_actions
        - delivery_reserve_seconds
    # Conversation memory the engine owns, bounded in sessions, exchanges,
    # bytes and age (R6).
    conversation_memory:
      title: Conversation memory
      type: object
      properties:
        max_sessions:
          title: Max sessions
          type: integer
          minimum: 1
          description: Maximum remembered sessions; the oldest is evicted first.
        max_exchanges:
          title: Max exchanges
          type: integer
          minimum: 1
          description: Maximum retained exchanges per session.
        max_bytes:
          title: Max bytes
          type: integer
          minimum: 1
          description: Maximum retained bytes of exchanges per session.
        max_age_seconds:
          title: Max age seconds
          type: number
          description: Finite age after which a retained exchange is evicted.
      required:
        - max_sessions
        - max_exchanges
        - max_bytes
        - max_age_seconds
    # The generic fallback (R3): what the engine delivers, through the same
    # delivery list as a final response, when a run ends without one because
    # of budget exhaustion, deadline expiry or a stale drop.
    fallback:
      title: Fallback
      type: object
      properties:
        enabled:
          title: Enabled
          type: boolean
          description: Whether the fallback text is delivered at all.
        text:
          title: Text
          type: string
          description: The text delivered in place of the missing answer.
      required:
        - enabled
        - text
    # The backend capabilities the adapter verifies at `prepare`, before the
    # readiness barrier (R2, R4). `structured_output` is mandatory — the loop
    # needs one tool call or a final text per turn — and `vision` and `audio`
    # are the other names known, each adding one probe request (at most 3);
    # the settings hook holds the list to that vocabulary as a whole, naming
    # this field.
    capabilities:
      title: Capabilities
      type: object
      properties:
        required:
          title: Required
          type: array
          items:
            type: string
          description: >-
            Capabilities that must be verified before readiness, among
            structured_output (mandatory), vision and audio.
      required:
        - required
    # The terminal delivery step (R1, decision 1): a configured, ordered list
    # of delivery actions the final response (or the fallback text) is handed
    # to, one executor call per entry, resolved at `prepare`. `mode: fixed`
    # takes `actions`; `mode: modules` derives the list from the enabled
    # modules' actions that declare a delivery capability, ordered by
    # `preference`. An entry says how the text maps into its arguments:
    # `text_argument` names the argument, `none` declares an effect-only
    # delivery, and an absent key inherits the action's declaration. The
    # model never selects a delivery; `overrides` selects another list per
    # `<platform>/<channel_id>` destination.
    delivery:
      title: Delivery
      type: object
      properties:
        mode:
          title: Mode
          type: string
          enum:
            - fixed
            - modules
          description: How the delivery list is built.
        actions:
          title: Actions
          type: array
          items:
            title: Delivery entry
            type: object
            properties:
              action:
                title: Action
                type: string
                description: Name of a delivery-capable action of the catalog.
              text_argument:
                title: Text argument
                type: string
                description: >-
                  Argument the answer text is put under, or `none` for an
                  effect-only entry; absent inherits the declaration.
              arguments:
                title: Arguments
                type: object
                description: Constant arguments the entry always carries.
            required:
              - action
          description: The ordered list mode `fixed` delivers through.
        preference:
          title: Preference
          type: array
          items:
            type: string
          description: >-
            Action names placed first, in this order, by `mode: modules`.
        # Keyed by destination, so the values cannot be declared here: the
        # settings hook holds each one to the shape of the group above.
        overrides:
          title: Overrides
          type: object
          description: >-
            Delivery lists of the same shape (`mode`, `actions`, `preference`)
            selected per destination, keyed by `<platform>/<channel_id>`.
      required:
        - mode
    # Presence (R1), both optional: absent, the system instructions and the
    # delivery path are exactly those of phase 2. The schema subset has no
    # length or count keywords, so the bounds stated in the descriptions —
    # persona and instructions at most 2000 characters, at most 16 routes,
    # a command of at most 32 characters, unique route names — are enforced
    # by the settings hook, naming the field.
    persona:
      title: Persona
      type: string
      description: >-
        Replaces the opening identity line of the system instructions, at
        most 2000 characters; the fixed lines about tools and plain-text
        output are always kept.
    routes:
      title: Routes
      type: array
      description: >-
        At most 16 routes, evaluated in order once per run from the
        triggering event; the first match wins, and with none the
        destination's list and the plain instructions apply.
      items:
        title: Route
        type: object
        properties:
          name:
            title: Name
            type: string
            description: Unique name of the route, used in startup diagnostics.
          match:
            title: Match
            type: object
            properties:
              kinds:
                title: Kinds
                type: array
                items:
                  type: string
                  enum:
                    - message
                    - sub
                    - resub
                    - sub_gift
                    - community_sub_gift
                    - raid
                    - follow
                    - tip
                    - watch_tick
                description: Non-empty list of event kinds the route matches.
              command:
                title: Command
                type: string
                description: >-
                  One token of at most 32 characters the event text must
                  start with, compared case-insensitively as a whole token.
              audience:
                title: Audience
                type: string
                enum:
                  - broadcaster
                  - moderators
                  - vips
                  - subscribers
                  - everyone
                description: >-
                  Satisfied only by a role the platform attested with a
                  provenance, never by the text.
            required:
              - kinds
          instructions:
            title: Instructions
            type: string
            description: >-
              Appended to the system instructions of a matched run, at most
              2000 characters.
          delivery:
            title: Delivery
            type: object
            description: >-
              A delivery list of the shape above (`mode`, `actions`,
              `preference`) used instead of the destination's list. A list
              holding an effect that receives no answer text needs
              `match.audience` broadcaster or moderators, or platform notice
              kinds only; otherwise startup fails naming the route.
        required:
          - name
          - match
  required:
    - endpoint
    - model
    - api_key
    - admission
    - budget
    - conversation_memory
    - fallback
    - capabilities
    - delivery
settings_validator: validate_settings

# The setting above that is a credential (R8). Its accepted value — literal
# or resolved from `${NAME}` — is redacted from every supervision trace and
# lost-trace diagnostic before this module is activated, whether or not the
# configuration lists it under `secrets`. The endpoint is not a credential by
# itself; a deployment whose backend URL embeds one lists it under `secrets`.
credentials:
  - api_key
