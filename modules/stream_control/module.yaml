# Stream scenes and platform polls — manifest v2 (R6, R7, R8, R9).
#
# What this file declares, the runtime validates at discovery and acts on at
# activation. It declares shapes only: no grant lives here. Both actions are
# `write`s: `stream.scene.set` switches the program scene of the configured
# scene provider (the `stream` scope of any platform and any channel: which
# broadcast software answers is the business of `scenes.provider`, never of
# the brain and never of a platform); `stream.poll.create` opens one poll on a
# platform through the poll service that platform publishes. No platform name
# appears here.

name: stream_control
manifest_version: 2
# The runtime contract this module is built against, compared at load against
# `core.runtime.RUNTIME_API`.
runtime_api: 2

# Action-driven: nothing is published and nothing is consumed.
produces: []
consumes: []
middleware: false

# No lifecycle role: the handle takes part in `prepare` (probe the scene
# provider, bind, mark ready), `drain` (finish the command in flight) and
# `close` (withdraw readiness, release the provider).
lifecycle:
  roles: []

# The scene provider and the scenes a call may name, the poll bounds, and the
# `required` policy (R6, R7, R8). The shapes are checked by the declared hook,
# one diagnostic per field, value-free: no URL or password is ever echoed. No
# setting shortens a call's deadline: a command still pending when the call
# deadline itself is reached is reported as the interruption it is (R10). The
# reserved `limits` block the entry point hands every enabled module is
# accepted and not read.
settings_schema:
  title: Stream control settings
  type: object
  properties:
    scenes:
      title: Scenes
      type: object
      description: The scene provider and the scenes `stream.scene.set` may switch to.
      properties:
        provider:
          title: Provider
          type: object
          description: >-
            Which scene provider serves `stream.scene.set`. With `kind: none`
            the action is declared and not bound here, so another module (a
            proxy) may serve it.
          properties:
            kind:
              title: Kind
              default: "none"
              type: string
              enum:
                - none
                - scripted
                - websocket
              description: >-
                `none` (no local provider), `scripted` (an injected provider,
                for tests) or `websocket`. Default `none`.
            url:
              title: URL
              type: string
              description: >-
                The `websocket` provider's address: `ws://` on a loopback host
                only, `wss://` otherwise.
            password:
              title: Password
              type: string
              description: >-
                The `websocket` provider's password, redacted from every trace
                and diagnostic.
            connect_timeout_seconds:
              title: Connect timeout seconds
              default: 5
              type: number
              description: How long the provider may take to connect. Default 5.
            request_timeout_seconds:
              title: Request timeout seconds
              default: 5
              type: number
              description: How long one provider request may take. Default 5.
        allowed:
          title: Allowed
          type: array
          items:
            type: string
          description: The allowlist of scene names (1 to 64 characters each).
        max_waiters:
          title: Max waiters
          default: 1
          type: integer
          minimum: 0
          description: >-
            How many calls may wait behind the one set command in flight
            before one more is refused `resource_busy`. Default 1.
    polls:
      title: Polls
      type: object
      description: The poll bounds `stream.poll.create` holds every call to.
      properties:
        enabled:
          title: Enabled
          default: false
          type: boolean
          description: Whether polls are offered at all. Default false.
        max_question_chars:
          title: Max question chars
          default: 60
          type: integer
          minimum: 1
          description: The longest question. Default 60.
        min_options:
          title: Min options
          default: 2
          type: integer
          minimum: 1
          description: The fewest options. Default 2.
        max_options:
          title: Max options
          default: 5
          type: integer
          minimum: 1
          description: The most options. Default 5.
        max_option_chars:
          title: Max option chars
          default: 25
          type: integer
          minimum: 1
          description: The longest option. Default 25.
        min_duration_seconds:
          title: Min duration seconds
          default: 15
          type: integer
          minimum: 1
          description: The shortest poll. Default 15.
        max_duration_seconds:
          title: Max duration seconds
          default: 1800
          type: integer
          minimum: 1
          description: The longest poll. Default 1800.
        max_waiters:
          title: Max waiters
          default: 1
          type: integer
          minimum: 0
          description: >-
            How many calls may wait behind the create in flight on one channel
            before one more is refused `resource_busy`. Default 1.
        max_tracked_channels:
          title: Max tracked channels
          default: 256
          type: integer
          minimum: 1
          description: The most channels the tracked poll table holds. Default 256.
    required:
      title: Required
      default: false
      type: boolean
      description: >-
        Whether an unavailable dependency at `prepare` fails startup (true)
        or leaves the affected action unbound (false). Default false.
    limits:
      title: Limits
      type: object
      description: >-
        The accepted `limits` block, handed over by the entry point to every
        enabled module. Not read here: this module owns its own bounds.
settings_validator: validate_settings

# The scene provider's password, when one is configured, is redacted like
# every declared credential.
credentials:
  - scenes.provider.password

actions:
  - name: stream.scene.set
    version: 1
    description: >-
      Switch the stream to an allowed scene. Success means the scene provider
      reported the new scene as current after the switch; `reconciled` is true
      when that confirmation came from a reconciliation read after the switch
      command's own answer was lost.
    argument_schema:
      type: object
      properties:
        scene:
          type: string
          description: An allowed scene name, 1 to 64 characters.
      required:
        - scene
      additionalProperties: false
    result_schema:
      type: object
      properties:
        scene:
          type: string
          description: The scene now current.
        previous_scene:
          type: string
          description: The scene that was current before the switch.
        confirmed_at:
          type: number
          description: When the provider confirmed the scene, on the runtime clock.
        reconciled:
          type: boolean
          description: Whether the confirmation came from a reconciliation read.
      required:
        - scene
        - previous_scene
        - confirmed_at
        - reconciled
      additionalProperties: false
    nature: write
    required_permissions:
      - stream.scene
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: stream
    timeout_seconds: 15
    # A scene switch is not repeated blindly: an uncertain one is reconciled.
    idempotency: none
    # Effect-only delivery (R2): the answer text is not passed; the scene is
    # named by the delivery entry's own arguments.
    delivery:
      text_argument: none

  - name: stream.poll.create
    version: 1
    description: >-
      Open one poll on the destination's channel. At most one create request
      is sent per call; a channel already running a poll is refused.
    argument_schema:
      type: object
      properties:
        question:
          type: string
          description: The poll question, within the configured length.
        options:
          type: array
          items:
            type: string
          description: The distinct options, within the configured count and length.
        duration_seconds:
          type: integer
          minimum: 1
          description: How long the poll runs, within the configured bounds.
      required:
        - question
        - options
        - duration_seconds
      additionalProperties: false
    result_schema:
      type: object
      properties:
        poll_id:
          type: string
          description: The platform's identifier of the poll.
        state:
          type: string
          enum:
            - active
          description: The poll state; `active` on a success.
        question:
          type: string
          description: The poll question.
        options:
          type: array
          items:
            type: string
          description: The poll options.
        started_at:
          type: number
          description: When the poll started, in epoch seconds.
        ends_at:
          type: number
          description: When the poll ends, in epoch seconds.
        reconciled:
          type: boolean
          description: Whether the poll was confirmed by a reconciliation read.
      required:
        - poll_id
        - state
        - question
        - options
        - started_at
        - ends_at
        - reconciled
      additionalProperties: false
    nature: write
    required_permissions:
      - stream.poll
    supported_destinations:
      - platform: "*"
        channel_id: "*"
        scope: poll
    timeout_seconds: 20
    # Creating twice opens two polls.
    idempotency: none
