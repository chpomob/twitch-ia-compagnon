[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-ia-compagnon"
version = "0.1.0"
description = "Modular AI companion for Twitch"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
